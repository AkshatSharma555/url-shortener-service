name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Redis Service container add kiya hai taaki tests timeout na hon
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Integration Tests
      run: npm run test
      env:
        API_KEY: 'test_secret_key_123'
        # Local mock database url (Agar migrations run karni hon toh SQLite ya mock use hota hai, abhi ke liye test bypass ke liye)
        DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/testdb'
        # Local Redis service jo upar container me chal rahi hai
        REDIS_URL: 'redis://localhost:6379'

    - name: Build Project
      run: npm run build