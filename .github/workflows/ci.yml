name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Integration Tests
      run: npm run test
      env:
        # Test environment ke liye dummy keys taaki pipeline block na ho
        API_KEY: 'test_secret_key_123'
        DATABASE_URL: 'postgresql://mock:mock@localhost:5432/mockdb'
        REDIS_URL: 'rediss://default:mock@localhost:6379'

    - name: Build Project
      run: npm run build