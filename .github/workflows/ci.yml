name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Postgres aur Redis dono services CI runner par start hongi
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Prisma Database Push (Setup Test DB)
      run: npx prisma db push
      env:
        DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/testdb?schema=public'

    - name: Run Integration Tests
      run: npm run test
      env:
        API_KEY: 'test_secret_key_123'
        DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/testdb?schema=public'
        REDIS_URL: 'redis://localhost:6379'

    - name: Build Project
      run: npm run build